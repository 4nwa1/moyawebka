<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/footer.css">
</head>
<body>
    <header>Мой сайт - Галерея</header>
    <nav>
        <a href="../index.html">Главная</a> |
        <a href="../pages/about.html">О нас</a> |
        <a href="../pages/contact.html">Контакты</a> |
        <a href="../pages/gallery.html">Галерея</a>
    </nav>
    <h1>Галерея изображений</h1>
    <div style="text-align: center;">
        <img id="galleryImage" src="https://picsum.photos/400/300?random=1" style="width: 400px; height: 300px; border: 2px solid #ccc;">
        <br><br>
        <button id="prevBtn" style="padding: 10px 20px;">◀ Назад</button>
        <button id="nextBtn" style="padding: 10px 20px;">Вперед ▶</button>
    </div>
    <footer>Подвал сайта</footer>
    <script>
        const images = [
            "https://picsum.photos/400/300?random=1",
            "https://picsum.photos/400/300?random=2",
            "https://picsum.photos/400/300?random=3",
            "https://picsum.photos/400/300?random=4",
            "https://picsum.photos/400/300?random=5"
        ];
        let currentIndex = 0;
        const imgElement = document.getElementById("galleryImage");
        document.getElementById("prevBtn").onclick = () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            imgElement.src = images[currentIndex];
        };
        document.getElementById("nextBtn").onclick = () => {
            currentIndex = (currentIndex + 1) % images.length;
            imgElement.src = images[currentIndex];
        };
    </script>
</body>
</html>
